<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1018"/>
      <stop offset="40%" stop-color="#161a28"/>
      <stop offset="100%" stop-color="#1d2230"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="0.5"/>
    </pattern>
    <pattern id="diagonal" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="120" stroke="rgba(255,255,255,0.015)" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="glow" cx="75%" cy="15%" r="65%">
      <stop offset="0%" stop-color="rgba(240,160,96,0.07)"/>
      <stop offset="50%" stop-color="rgba(240,160,96,0.02)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glow2" cx="25%" cy="85%" r="50%">
      <stop offset="0%" stop-color="rgba(100,120,200,0.04)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <rect width="100%" height="100%" fill="url(#diagonal)"/>
  <rect width="100%" height="100%" fill="url(#glow)"/>
  <rect width="100%" height="100%" fill="url(#glow2)"/>
</svg>
