<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f6f3"/>
      <stop offset="50%" stop-color="#f5f2ed"/>
      <stop offset="100%" stop-color="#f0ece5"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.7" fill="rgba(60,40,20,0.05)"/>
    </pattern>
    <pattern id="lines" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(-15)">
      <line x1="0" y1="0" x2="0" y2="80" stroke="rgba(60,40,20,0.025)" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="glow" cx="80%" cy="10%" r="55%">
      <stop offset="0%" stop-color="rgba(232,148,90,0.08)"/>
      <stop offset="60%" stop-color="rgba(232,148,90,0.02)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="90%" r="45%">
      <stop offset="0%" stop-color="rgba(180,160,220,0.04)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#dots)"/>
  <rect width="100%" height="100%" fill="url(#lines)"/>
  <rect width="100%" height="100%" fill="url(#glow)"/>
  <rect width="100%" height="100%" fill="url(#glow2)"/>
</svg>
